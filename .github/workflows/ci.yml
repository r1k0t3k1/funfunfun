name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "README.md"
      - "f3-client/**" 

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable

      - name: Install cargo-related tools
        uses: taiki-e/install-action@v2
        with:
          tool: nextest, cargo-make

      - name: build
        run: cargo make build

      - name: generate openapi.json
        run: cargo test export_openapi_json

      - name: check diff 
        run: git diff --exit-code openapi.json
#      - name: Tests compile
#        run: cargo make test-ci --no-run --locked

#      - name: Test
#        run: cargo make test-ci

      - name: Clippy
        run: cargo make clippy-ci -- -Dwarnings

      - name: Rustfmt
        run: cargo make fmt -- --check
          
